<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniHoodZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>AniHoodZ</h1></header>
<!-- Navigation -->
    <nav class="d-flex justify-content-between align-items-center p-3 border-bottom sticky-top">
        
<!-- This div contains the register, login and logout features, plus when logged in it greets the user  -->
        <div id="account">
            <form id="auth-form">
                <input type="text" id="userName" placeholder="Username" aria-label="Username">
                <button type="submit" id="register-btn" class="btn btn-dark" data-action="register"> Register </button>
                <button type="submit" id="login-btn" class="btn btn-dark" data-action="login"> Log In</button>
            </form>
            <p id="auth-message"></p>
            <div id="welcome" class="hidden">
                <span id="welcome-text"></span>
                <button id="logout-btn" class="btn btn-dark"> Log Out </button>
            </div>
        </div>

        <div class="d-flex">
        <select id="font-select" class="form-select form-select-sm w-auto" aria-label="Font">
            <option value="Arial, sans-serif">Arial</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="'Courier New', monospace">Courier New</option>
        </select>
        <button id="reset-prefs" class="btn btn-dark">Reset</button>
        </div>
        
        <!-- this button toggles the cart page off and on -->
        <button id="cart-toggle" class="btn btn-dark">
            Cart (<span id="cart-count"> 0 </span>)
        </button>

        <div id="cart-panel" class="closed">
            <h2 class="h4">Your cart</h2>
            <ul id="cart-items" class="list-group mb-3"></ul>
            <p class="fw-bold">
                Total: <span id="cart-total">R0.00</span>
            </p>
            <button id="clear-cart" class="btn btn-outline-danger btn-sm">
                Clear cart
            </button>
        </div>
    </nav>

    <p id="members-only" class="my-2"> Only members can add to cart!</p>
    <p id="cache-notice" class="hidden small my-1"></p>
<!-- Catalogue Section -->
    <main class="container my-4">
        <div id="products" class="row g-4"></div>
    </main>
<!-- catalogue item template-->
    <template id="product-template">
        <div class="col-12 col-sm-6 col-lg-4">

            <div class="card h-100">
                <img class="card-img-top product-image img-fluid" src="" alt="">

                <div class="card-body d-flex flex-column">
                    <h2 class="card-title h5 product-name"></h2>
                    <p class="card-text product-description"></p>
                    <p class="fw-bold mt-auto product-price"></p>
                    <button class="btn btn-primary add-to-cart">
                        Add to cart
                    </button>
                </div>

            </div>
        </div>
    </template>
<!-- cart section template -->
    <template id="cart-row-template">
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="cart-row-text"></span>
            <button class="btn btn-sm btn-outline-danger remove">
                Remove
            </button>
        </li>
    </template>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
